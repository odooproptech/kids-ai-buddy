services:
  web:
    build: ./apps/web
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      - api
  api:
    build: ./apps/api
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STT_MODEL: ${STT_MODEL:-gpt-4o-mini-transcribe}
      CHAT_MODEL: ${CHAT_MODEL:-gpt-4.1-mini}
      PARENT_PIN: ${PARENT_PIN:-}
    ports:
      - "127.0.0.1:8000:8000"
